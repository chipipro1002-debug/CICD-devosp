name: 6-Stage Zero-Trust DevSecOps CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # ==========================================
  # STAGE 1: Supply-Chain & Gitleaks DLP
  # ==========================================
  stage-1-supply-chain:
    name: "Stage 1 - Supply-Chain, Gitleaks & 8-Gate DLP"
    runs-on: ubuntu-latest
    steps:
      - name: Giam sat mang Egress Runner (StepSecurity)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quet Secret ro ri (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # STAGE 2: SAST, SCA & Race Tests
  # ==========================================
  stage-2-sast-sca:
    name: "Stage 2 - SAST (gosec/Semgrep), SCA (govulncheck) & Race Tests"
    needs: [stage-1-supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Giam sat mang Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Chay Race Tests
        run: go test -v -race ./...

      - name: Chay gosec (Phan tich tinh SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=text ./... || true

      - name: Chay govulncheck (SCA Dependencies)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  # ==========================================
  # STAGE 3: SHA-384 SRI & Frontend CSP Gate
  # ==========================================
  stage-3-sri-csp:
    name: "Stage 3 - SHA-384 SRI & Headless Browser CSP/DOM Gate"
    needs: [stage-1-supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Giam sat mang Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Kiem tra tinh toan ven Subresource Integrity (SRI)
        run: |
          echo "Kiem tra ma bam SHA-384 file tinh..."
          find . -maxdepth 2 -type f \( -name "*.js" -o -name "*.css" \) -exec openssl dgst -sha384 -binary {} + | openssl base64 -A || true

  # ==========================================
  # STAGE 4: Distroless Image, Trivy CVE & SBOM
  # ==========================================
  stage-4-image-cve:
    name: "Stage 4 - Distroless Image, Trivy CVE Scan & SBOM"
    needs: [stage-2-sast-sca, stage-3-sri-csp]
    runs-on: ubuntu-latest
    steps:
      - name: Giam sat mang Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Distroless Image
        run: |
          docker build -t local/app:scan -f Dockerfile .

      - name: Quet lo hong Container voi Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'local/app:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Tao ban ke khai phan mem SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'local/app:scan'
          format: spdx-json
          output-file: 'sbom.spdx.json'

  # ==========================================
  # STAGE 5: Live Container DAST & Active Probe Suite
  # ==========================================
  stage-5-dast-probe:
    name: "Stage 5 - Live Container DAST & Active Probe Suite"
    needs: [stage-4-image-cve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Khoi chay Container kiem thu dong
        run: |
          docker build -t local/app:dast -f Dockerfile .
          docker run -d --name live-test-container -p 8080:8080 local/app:dast
          sleep 5

      - name: Ban Active Probes kiem tra HTTP Endpoints va Headers
        run: |
          echo "=== 1. Kiem tra Health Endpoint ==="
          curl -f -s http://localhost:8080/healthz || exit 1

          echo "=== 2. Kiem tra Security Headers ==="
          HEADERS=$(curl -s -I http://localhost:8080/)
          echo "$HEADERS"
          echo "$HEADERS" | grep -i "X-Content-Type-Options" || (echo "Loi: Thieu header X-Content-Type-Options" && exit 1)

      - name: Huy Container kiem thu
        if: always()
        run: docker rm -f live-test-container || true

  # ==========================================
  # STAGE 6: Gated GHCR Publish & SLSA Attestation
  # ==========================================
  stage-6-ghcr-publish:
    name: "Stage 6 - Gated GHCR Publish & SLSA Provenance Attestation"
    needs: [stage-5-dast-probe]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dang nhap vao GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dong goi va Day Image len GHCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Ky so nguon goc phan mem SLSA
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
